.glow1{animation:drift 14s ease-in-out infinite alternate}
.glow2{animation:drift 18s ease-in-out -6s infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(70px,40px)}}
.status i{animation:ping 2s infinite}
@keyframes ping{0%{opacity:1}70%,100%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
